<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OneWeb Campaign Film</title>
  <style>
    @font-face { font-family: Gopher; src: url('/fonts/fonnts.com-Gopher_Regular.otf'); }
    html, body { margin: 0; background: #080b12; overflow: hidden; }
    canvas { display: block; width: 1920px; height: 1080px; }
  </style>
</head>
<body>
  <canvas id="film" width="1920" height="1080" aria-label="OneWeb campaign introduction video"></canvas>
  <script>
    const W = 1920, H = 1080, DURATION = 60;
    const canvas = document.getElementById('film');
    const ctx = canvas.getContext('2d', { alpha: false });
    const palette = { blue:'#3083fd', navy:'#10182f', orange:'#ff5a00', red:'#ff0038', lime:'#ccff00', paper:'#f4f8f9', ink:'#050505' };
    const files = {
      logo:'/public/logoimage.png', capital:'/public/capitalimage.png', sxsw:'/public/sxswimage.png', conference:'/public/conferenceimage.jpg',
      coding:'/public/codingimage.jpg', speaking:'/public/speakingimage.jpg', policy:'/public/policyimage.jpeg',
      collaboration:'/public/collaborationimage.png', guide:'/public/digital-accessibility-guide-cover.png'
    };
    const images = {};
    const captions = [
      [0,8.3,'The web is where we learn, work, create, and connect. But too many people still meet digital barriers that shut them out.'],
      [8.3,16.4,'OneWeb is a youth-led campaign building a future where everyone can access and use the web independently.'],
      [16.4,25.1,'We bring together accessible technology, community knowledge, and public advocacy to turn inclusion into practical action.'],
      [25.1,39.2,'Through accessible tools, hands-on training, free resources, and policy advocacy, we help remove barriers from the services and information we all rely on.'],
      [39.2,49.7,'Our work has reached more than 250,000 people in over 30 countries, while raising more than $30,000 to expand the mission.'],
      [49.7,56.2,'But a truly accessible web takes all of us. Learn. Share. Build access into everything you create.'],
      [56.2,60.1,'Join OneWeb—and join the fight to end digital barriers.']
    ];

    const clamp = (v,a=0,b=1) => Math.max(a,Math.min(b,v));
    const ease = v => 1-Math.pow(1-clamp(v),3);
    function loadImage(src) { return new Promise((resolve,reject)=>{ const i=new Image(); i.onload=()=>resolve(i); i.onerror=reject; i.src=src; }); }
    function cover(img,x,y,w,h,zoom=1,panX=.5,panY=.5) {
      const s=Math.max(w/img.width,h/img.height)*zoom, sw=w/s, sh=h/s;
      const sx=clamp((img.width-sw)*panX,0,img.width-sw), sy=clamp((img.height-sh)*panY,0,img.height-sh);
      ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
    }
    function roundedRect(x,y,w,h,r,fill,stroke=null,lw=0) {
      ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fillStyle=fill; ctx.fill();
      if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
    }
    function text(txt,x,y,size,color='#fff',align='left',font='Arial Black',weight=900) {
      ctx.save(); ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='alphabetic'; ctx.font=`${weight} ${size}px "${font}", Arial, sans-serif`; ctx.fillText(txt,x,y); ctx.restore();
    }
    function label(txt,x,y,color=palette.orange,align='left') {
      ctx.save(); ctx.font='700 25px Gopher, Consolas, monospace'; ctx.textAlign=align; ctx.fillStyle=color; ctx.letterSpacing='4px'; ctx.fillText(txt.toUpperCase(),x,y); ctx.restore();
    }
    function wrap(txt,x,y,maxWidth,lineHeight,font,color='#fff',align='center') {
      ctx.save(); ctx.font=font; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle';
      const words=txt.split(' '), lines=[]; let line='';
      for(const word of words){ const test=line?`${line} ${word}`:word; if(ctx.measureText(test).width>maxWidth && line){lines.push(line);line=word;}else line=test; }
      if(line) lines.push(line);
      const start=y-(lines.length-1)*lineHeight/2; lines.forEach((l,i)=>ctx.fillText(l,x,start+i*lineHeight)); ctx.restore();
    }
    function photo(img,x,y,w,h,angle=0,zoom=1){
      ctx.save();ctx.translate(x+w/2,y+h/2);ctx.rotate(angle);ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=30;ctx.shadowOffsetY=18;
      ctx.fillStyle='#fff';ctx.fillRect(-w/2-12,-h/2-12,w+24,h+24);ctx.shadowColor='transparent';
      cover(img,-w/2,-h/2,w,h,zoom);ctx.restore();
    }
    function sceneAlpha(t,start,end){ return clamp((t-start)/.65)*clamp((end-t)/.65); }
    function background(color){ctx.fillStyle=color;ctx.fillRect(0,0,W,H);}
    function tape(y,angle,txt){
      ctx.save();ctx.translate(W/2,y);ctx.rotate(angle);ctx.fillStyle=palette.lime;ctx.fillRect(-1200,-38,2400,76);
      text(Array(8).fill(txt+'  •  ').join(''),0,13,28,palette.ink,'center','Arial Black');ctx.restore();
    }
    function drawScene(t){
      ctx.clearRect(0,0,W,H);
      if(t<8){
        background(palette.blue); const p=ease(t/2); const pulse=1+.018*Math.sin(t*1.8);
        ctx.save();ctx.translate(W/2,H/2-110);ctx.scale(pulse,pulse);ctx.globalAlpha=p;ctx.drawImage(images.logo,-115,-115,230,230);ctx.restore();
        ctx.globalAlpha=p;text('ONE WEB.',W/2,655,132,palette.ink,'center'); text('ONE FUTURE.',W/2,790,132,'#fff','center');
        label('A CAMPAIGN FOR DIGITAL ACCESS',W/2,868,palette.lime,'center');ctx.globalAlpha=1;
      } else if(t<17){
        background(palette.navy); const q=t-8;
        photo(images.capital,80,150,590,650,-.055,1+.012*q); photo(images.sxsw,665,80,590,720,.035,1+.01*q); photo(images.conference,1260,170,580,620,-.03,1+.013*q);
        ctx.fillStyle='rgba(16,24,47,.50)';ctx.fillRect(0,0,W,H);
        text('THE WEB SHOULD',W/2,455,116,'#fff','center');text('WORK FOR EVERYONE.',W/2,590,116,palette.lime,'center');
        tape(765,-.045,'END DIGITAL BARRIERS');
      } else if(t<26){
        const q=t-17;background(palette.paper);cover(images.conference,980,0,940,H,1.06+.01*q,.52,.42);
        const grad=ctx.createLinearGradient(760,0,1200,0);grad.addColorStop(0,palette.paper);grad.addColorStop(1,'rgba(244,248,249,0)');ctx.fillStyle=grad;ctx.fillRect(700,0,520,H);
        label('WHAT IS ONEWEB?',120,250,palette.orange);text('A YOUTH-LED',120,420,105,palette.ink);text('CAMPAIGN.',120,535,105,palette.blue);
        wrap('Building a future where everyone can access and use the web independently.',120,720,720,54,'700 40px Arial',palette.navy,'left');
      } else if(t<40){
        background(palette.navy); label('OUR WORK IN ACTION',W/2,125,palette.orange,'center');
        const cards=[['01',images.coding,'DIGITAL','ACCESSIBILITY',palette.lime],['02',images.speaking,'COMMUNITY','TRAINING',palette.orange],['03',images.policy,'POLICY &','ADVOCACY',palette.blue]];
        cards.forEach((c,i)=>{ const x=100+i*590, y=200+(i===1?34:0); roundedRect(x,y,540,660,0,'#fff',palette.ink,5); cover(c[1],x,y,540,330,1.02+.004*(t-26)); roundedRect(x+22,y+22,70,60,0,c[4],palette.ink,3); text(c[0],x+57,y+64,26,palette.ink,'center'); text(c[2],x+32,y+420,48,palette.ink);text(c[3],x+32,y+478,48,palette.ink); });
        wrap('Accessible technology  •  Community knowledge  •  Public advocacy',W/2,970,1600,48,'700 34px Gopher',palette.paper,'center');
      } else if(t<50){
        background(palette.red); label('MEASURABLE IMPACT',W/2,180,'#fff','center');
        const stats=[['250K+','PEOPLE REACHED'],['30+','COUNTRIES'],['$30K+','FUNDING RAISED']];
        stats.forEach((s,i)=>{const x=330+i*630; const pop=ease(clamp((t-40-i*.35)/1.2));ctx.save();ctx.translate(x,500);ctx.scale(pop,pop);text(s[0],0,0,126,'#fff','center');text(s[1],0,95,33,palette.ink,'center');ctx.restore();});
        ctx.fillStyle=palette.ink;ctx.fillRect(0,820,W,6);text('ACROSS COMMUNITIES. ACROSS BORDERS.',W/2,925,54,palette.ink,'center');
      } else {
        background(palette.navy); const q=t-50; ctx.globalAlpha=.28;cover(images.collaboration,80,85,1760,470,1+.006*q);ctx.globalAlpha=1;
        ctx.fillStyle='rgba(16,24,47,.75)';ctx.fillRect(0,0,W,H);
        if(q<6){label('A TRULY ACCESSIBLE WEB TAKES ALL OF US',W/2,300,palette.orange,'center');text('LEARN.',W/2-390,520,104,'#fff','center');text('SHARE.',W/2,520,104,palette.lime,'center');text('BUILD.',W/2+390,520,104,palette.blue,'center');text('ACCESS INTO EVERYTHING YOU CREATE.',W/2,665,62,'#fff','center');}
        else {const p=ease((q-6)/1.2);ctx.globalAlpha=p;ctx.drawImage(images.logo,W/2-82,170,164,164);text('JOIN THE FIGHT.',W/2,505,120,'#fff','center');text('END DIGITAL BARRIERS.',W/2,640,105,palette.lime,'center');roundedRect(W/2-190,720,380,82,0,palette.orange,palette.ink,4);text('JOIN ONEWEB',W/2,774,30,palette.ink,'center','Gopher');ctx.globalAlpha=1;}
      }
      const cap=captions.find(c=>t>=c[0]&&t<c[1]);
      if(cap){roundedRect(105,H-124,W-210,84,10,'rgba(0,0,0,.82)');wrap(cap[2],W/2,H-82,W-280,36,'600 29px Arial','#fff','center');}
      ctx.fillStyle=palette.orange;ctx.fillRect(0,H-10,W*(t/DURATION),10);
    }
    function makeMusic(audioCtx,dest,start){
      const master=audioCtx.createGain(); master.gain.setValueAtTime(.045,start); master.gain.linearRampToValueAtTime(.065,start+5); master.gain.setValueAtTime(.065,start+56); master.gain.linearRampToValueAtTime(0,start+60); master.connect(dest);
      const chords=[[110,164.81,220],[98,146.83,196],[130.81,196,261.63],[87.31,130.81,174.61]];
      for(let bar=0;bar<15;bar++){const when=start+bar*4, chord=chords[bar%4]; chord.forEach((f,j)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=j===0?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(j===0?.7:.18,when+.8);g.gain.linearRampToValueAtTime(0,when+4);o.connect(g).connect(master);o.start(when);o.stop(when+4.05);});}
      for(let beat=0;beat<30;beat++){const when=start+beat*2, o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(82,when);o.frequency.exponentialRampToValueAtTime(46,when+.22);g.gain.setValueAtTime(.32,when);g.gain.exponentialRampToValueAtTime(.001,when+.28);o.connect(g).connect(master);o.start(when);o.stop(when+.3);}
    }
    async function startRender(){
      await document.fonts.ready;
      for(const [k,v] of Object.entries(files)) images[k]=await loadImage(v);
      const narration=new Audio('/video/oneweb-narration.wav'); narration.preload='auto'; await new Promise((res,rej)=>{narration.oncanplaythrough=res;narration.onerror=rej; narration.load();});
      const audioCtx=new AudioContext({sampleRate:48000}); await audioCtx.resume(); const dest=audioCtx.createMediaStreamDestination();
      const narrationSource=audioCtx.createMediaElementSource(narration), narrationGain=audioCtx.createGain(); narrationGain.gain.value=1; narrationSource.connect(narrationGain).connect(dest);
      const stream=canvas.captureStream(30); dest.stream.getAudioTracks().forEach(track=>stream.addTrack(track));
      const mime=MediaRecorder.isTypeSupported('video/mp4;codecs=avc1,mp4a.40.2')?'video/mp4;codecs=avc1,mp4a.40.2':'video/mp4';
      const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6500000,audioBitsPerSecond:192000}); const chunks=[];
      recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
      const done=new Promise(resolve=>recorder.onstop=resolve); recorder.start(1000);
      const audioStart=audioCtx.currentTime+.12; makeMusic(audioCtx,dest,audioStart); await new Promise(r=>setTimeout(r,120)); narration.play();
      const started=performance.now();
      await new Promise(resolve=>{function frame(now){const t=Math.min((now-started)/1000,DURATION);drawScene(t);if(t<DURATION)requestAnimationFrame(frame);else resolve();}requestAnimationFrame(frame);});
      recorder.stop(); await done; narration.pause(); await audioCtx.close();
      const blob=new Blob(chunks,{type:mime}); const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='OneWeb-Campaign-Introduction.mp4';document.body.appendChild(a);a.click();
      document.title=`DONE:${blob.size}:${narration.duration.toFixed(2)}`;
    }
    window.startRender=startRender;
    background(palette.blue);
  </script>
</body>
</html>
